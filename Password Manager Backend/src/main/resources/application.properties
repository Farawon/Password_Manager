spring.application.name=Password Manager Service
hibp.api.url=${HIBP_API}
encryption.key= ${ENCRYPTION_KEY}
spring.datasource.url=${DB_URL}
spring.datasource.username= ${DB_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SEKRET}
jwt.access-token-minutes= ${JWT_TOKEN_MINUTES}
jwt.refresh-token-days =${JWT_TOKEN_DAYS}

app.cookie.secure=true
app.cookie.same-site=None
app.cookie.partitioned=true

logging.level.org.springframework.security=DEBUG


stripe.api.key =${STRIPE_API_KEY}
stripe.webhook-secret = ${WEBHOOK_SECRET}

stripe.pro.subscription = ${STIPE_SUB_PRO} 
stripe.business.subscription = ${STRIPE_SUB_BIS}